name: Migrate production database

# Manual-approval migration job (MVP.md §9.2).
#
# Migrations are the one deploy step that can destroy data, so this workflow is
# `workflow_dispatch` only: it never runs on a push. It targets a GitHub
# Environment called `production`, which is where the required-reviewer rule is
# configured. If that environment has no protection rule, this job runs as soon
# as it is dispatched — set the rule up before relying on this.
#
# The migration is applied with drizzle-kit against DATABASE_URL_UNPOOLED, the
# direct (non-pooled) connection. A pooled connection can drop mid-migration and
# leave a half-applied schema.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm this runs against production'
        required: true
        type: string

concurrency:
  group: db-migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation phrase
        if: inputs.confirm != 'migrate'
        run: |
          echo "::error::Confirmation phrase did not match. Nothing was run."
          exit 1

  migrate:
    name: Apply migrations
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show pending migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npx drizzle-kit check

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: npm run db:migrate

      - name: Record the migration in the activity log
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=0 <<SQL || true
          INSERT INTO activity_logs (action, entity, meta)
          VALUES ('system.migration.applied', 'database',
                  '{"source":"github-actions","actor":"${{ github.actor }}","run":"${{ github.run_id }}"}'::jsonb);
          SQL
